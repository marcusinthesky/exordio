name: CI
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Draft PRs emit a skipped run; compute-heavy checks only run when ready.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    env:
      TECTONIC_CACHE_DIR: /tmp/exordio-tectonic-cache
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free hosted runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /opt/ghc
          df -h /
      # cache-nix-action requires a store writable by the runner user.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: 2.34.7
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a
        with:
          primary-key: nix-single-user-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'infra/nix/**') }}
          restore-prefixes-first-match: nix-single-user-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/uv
            ${{ env.TECTONIC_CACHE_DIR }}
            ~/.cache/mathlib
            ~/.bun/install/cache
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/uv.lock', '**/*.py.lock', '**/bun.lock', '**/lake-manifest.json') }}
      - name: Install matching devenv
        run: bash infra/nix/install-devenv.sh
      - name: Prepare dependencies
        run: devenv shell -- just setup
      - name: Validate
        run: devenv shell -- just check
